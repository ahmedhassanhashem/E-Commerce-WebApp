<!DOCTYPE html>
<html lang="en">
    <body>
        <div class="dash__box dash__box--shadow dash__box--radius dash__box--bg-white">
            <div class="dash__pad-2">
                <h1 class="dash__h1 u-s-m-b-14">Change Password</h1>

                <div class="row">
                    <div class="col-lg-12">
                        <form class="dash-edit-p" method="POST" id="passwordForm">
                            <!-- Current Password -->
                            <div class="gl-inline">
                                <div class="u-s-m-b-30">
                                    <label class="gl-label" for="current-password">CURRENT PASSWORD</label>
                                    <input class="input-text input-text--primary-style"
                                           type="password"
                                           id="current-password"
                                           name="currentPassword"
                                           required>
                                    <span id="current-password-status" class="validation-status"></span>
                                </div>
                            </div>

                            <!-- New Password -->
                            <div class="gl-inline">
                                <div class="u-s-m-b-30">
                                    <label class="gl-label" for="new-password">NEW PASSWORD</label>
                                    <input class="input-text input-text--primary-style"
                                           type="password"
                                           id="new-password"
                                           name="newPassword"
                                           required>
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="gl-inline">
                                <div class="u-s-m-b-30">
                                    <label class="gl-label" for="confirm-password">CONFIRM PASSWORD</label>
                                    <input class="input-text input-text--primary-style"
                                           type="password"
                                           id="confirm-password"
                                           name="confirmPassword"
                                           required>
                                    <span id="password-match-status" class="validation-status"></span>
                                </div>
                            </div>

                            <button class="btn btn--e-brand-b-2" type="submit">SUBMIT</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
    const currentPasswordInput = document.getElementById('current-password');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const currentPasswordStatus = document.getElementById('current-password-status');
    const passwordMatchStatus = document.getElementById('password-match-status');

    // Real-time validation for current password
    currentPasswordInput.addEventListener('input', function(e) {
        const currentPassword = e.target.value;

        fetch('validate-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'password=' + encodeURIComponent(currentPassword)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Server error: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (data.valid) {
                currentPasswordStatus.innerHTML = 'Valid password';
                currentPasswordStatus.style.color = 'green';
                currentPasswordInput.classList.remove('input-error');
                currentPasswordInput.classList.add('input-success');
            } else {
                currentPasswordStatus.innerHTML = data.error ? data.error : 'Invalid password';
                currentPasswordStatus.style.color = 'red';
                currentPasswordInput.classList.remove('input-success');
                currentPasswordInput.classList.add('input-error');
            }
        })
        .catch(error => {
            currentPasswordStatus.innerHTML = 'Error: ' + error.message;
            currentPasswordStatus.style.color = 'red';
        });
    });



    // Password matching validation
    function validatePasswordMatch() {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword && confirmPassword) {
            if (newPassword === confirmPassword) {
                passwordMatchStatus.innerHTML = 'Passwords match';
                passwordMatchStatus.style.color = 'green';
                confirmPasswordInput.classList.remove('input-error');
                confirmPasswordInput.classList.add('input-success');
                return true;
            } else {
                passwordMatchStatus.innerHTML = 'Passwords do not match';
                passwordMatchStatus.style.color = 'red';
                confirmPasswordInput.classList.remove('input-success');
                confirmPasswordInput.classList.add('input-error');
                return false;
            }
        }
        return false;
    }

    // Add event listeners for password matching validation
    newPasswordInput.addEventListener('input', validatePasswordMatch);
    confirmPasswordInput.addEventListener('input', validatePasswordMatch);


    // Form submission
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
        e.preventDefault();


        if (newPasswordInput.value === currentPasswordInput.value) {
            alert('New password cannot be the same as your current password');
            newPasswordInput.classList.remove('input-success');
            newPasswordInput.classList.add('input-error');
            return;
        }

        if (!currentPasswordInput.classList.contains('input-success') || !validatePasswordMatch()) {
            alert('Please fix validation errors before submitting');
            return;
        }

        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        const urlParams = new URLSearchParams();
        urlParams.append('currentPassword', currentPassword);
        urlParams.append('newPassword', newPassword);
        urlParams.append('confirmPassword', confirmPassword);

        fetch('update-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: urlParams.toString()
        })
        .then(response => {
        if (!response.ok) {
            return response.text().then(text => { throw new Error(text) });
        }
        return response.text();
         })
        .then(data => {

            let result;
            try {
                result = JSON.parse(data);
                alert(result.message);
                if (result.success) {
                    // Clear input values
                    document.getElementById("current-password").value = '';
                    document.getElementById("new-password").value = '';
                    document.getElementById("confirm-password").value = '';

                    // Remove success/error styling from inputs
                    document.getElementById("current-password").classList.remove('input-success', 'input-error');
                    document.getElementById("new-password").classList.remove('input-success', 'input-error');
                    document.getElementById("confirm-password").classList.remove('input-success', 'input-error');

                    // Clear status messages
                    document.getElementById("current-password-status").innerHTML = '';
                    document.getElementById("password-match-status").innerHTML = '';
                }
            } catch (e) {
                // Not JSON, just use the text
                alert(data);
                // Assume success if no error was thrown earlier
                document.getElementById("current-password").value = '';
                document.getElementById("new-password").value = '';
                document.getElementById("confirm-password").value = '';

                // Remove success/error styling from inputs
                document.getElementById("current-password").classList.remove('input-success', 'input-error');
                document.getElementById("new-password").classList.remove('input-success', 'input-error');
                document.getElementById("confirm-password").classList.remove('input-success', 'input-error');

                // Clear status messages
                document.getElementById("current-password-status").innerHTML = '';
                document.getElementById("password-match-status").innerHTML = '';
            }
        })
        .catch(error => {
            alert(error.message);
        });
    });
});
        </script>

        <style>
            .validation-status {
                margin-left: 10px;
                font-size: 0.9em;
            }
            .input-error {
                border-color: #dc3545 !important;
                box-shadow: 0 0 0 0.2rem rgba(220,53,69,.25);
            }
            .input-success {
                border-color: #28a745 !important;
                box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);
            }
        </style>
    </body>
</html>
